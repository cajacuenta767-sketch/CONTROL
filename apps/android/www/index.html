<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CONTROL</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#0f172a,#1e293b 60%,#1d4ed8 160%);color:#e2e8f0;min-height:100vh;display:grid;place-items:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.c{background:#fff;color:#1f2937;border-radius:14px;padding:26px 22px;width:min(420px,100%);box-sizing:border-box}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;color:#6b7280;font-size:14px;line-height:1.45}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #e5e7eb;border-radius:8px;font-size:16px}
button{width:100%;margin-top:12px;background:#1d4ed8;color:#fff;border:0;border-radius:8px;padding:13px;font-size:16px;font-weight:600}
.err{background:#fee2e2;color:#b91c1c;padding:10px 12px;border-radius:8px;font-size:13px;margin-top:12px;display:none}
</style></head><body>
<div class="c">
  <div class="logo">C</div>
  <h1>Conectar con tu CONTROL</h1>
  <p>Escribe la dirección del panel de tu agencia. Queda guardada en el teléfono.</p>
  <input id="s" placeholder="https://control.tuagencia.com" inputmode="url" autocapitalize="off">
  <button id="b">Conectar</button>
  <div class="err" id="e"></div>
</div>
<script>
  // Si ya hay servidor guardado, entra directo. El panel es una PWA: dentro del WebView funciona completo.
  const s = document.getElementById('s'), b = document.getElementById('b'), e = document.getElementById('e');
  const norm = (u) => { let x = String(u || '').trim(); if (!x) return ''; if (!/^https?:\/\//i.test(x)) x = 'https://' + x; return x.replace(/\/+$/, ''); };
  const guardado = localStorage.getItem('control.servidor');
  if (guardado && !location.hash.includes('cambiar')) location.replace(guardado + '/');
  if (guardado) s.value = guardado;
  b.onclick = async () => {
    const url = norm(s.value); if (!url) return;
    b.disabled = true; b.textContent = 'Conectando…'; e.style.display = 'none';
    try { const r = await fetch(url + '/api/v1/salud', { signal: AbortSignal.timeout(8000) }); if (!r.ok && r.status !== 503) throw new Error('respondió ' + r.status);
      localStorage.setItem('control.servidor', url); location.href = url + '/'; }
    catch (err) { e.textContent = 'No se pudo conectar: ' + err.message; e.style.display = 'block'; b.disabled = false; b.textContent = 'Conectar'; }
  };
</script></body></html>
